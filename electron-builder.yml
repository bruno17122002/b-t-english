appId: com.linguaquest.app
productName: B&T English
# File names avoid "&" (it breaks cmd.exe scripts); the window, shortcuts and installer still show "B&T English".
executableName: BTEnglish
copyright: Copyright © 2026 B&T English
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - build/icon.png
  - package.json
  - '!**/*.map'
  - '!out/**/*.js.map'
  - '!**/node_modules/zod/src/**'
  - '!**/node_modules/*/README.md'
extraResources:
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm/sql-wasm.wasm
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
asar: true
# Electron fuses (flipped in the binary at packaging time):
# - no ELECTRON_RUN_AS_NODE, NODE_OPTIONS or --inspect: the app cannot be turned into a Node shell or debugged
# - code is only loaded from app.asar and its integrity is checked at start, so a modified package will not run
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
compression: normal
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  license: build/license.txt
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: B&T English
  uninstallDisplayName: B&T English
  deleteAppDataOnUninstall: false
  artifactName: BT-English-Setup-${version}.${ext}
portable:
  artifactName: BT-English-Portable-${version}.${ext}
